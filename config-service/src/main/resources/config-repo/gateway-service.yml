server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/activity/**,/api/auth/**,/api/users/**,/api/activity/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userCB
                    fallbackUri: forward:/fallback/user
            - id: inventory-route
              uri: lb://inventory
              predicates:
                - Path=/api/**,/v3/api-docs,/v3/api-docs/**,/scalar,/scalar/**,/ws-alerts,/ws-alerts/**,/ws-notifications,/ws-notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCB
                    fallbackUri: forward:/fallback/inventory
            - id: predictor-route
              uri: lb://predictor-service
              predicates:
                - Path=/predictor/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: predictorCB
                    fallbackUri: forward:/fallback/predictor
            - id: mcp-route
              uri: lb://mcp-service
              predicates:
                - Path=/ai/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: mcpCB
                    fallbackUri: forward:/fallback/mcp

resilience4j:
  circuitbreaker:
    instances:
      userCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      inventoryCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      predictorCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      mcpCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      userCB:
        timeoutDuration: 5s
      inventoryCB:
        timeoutDuration: 5s
      predictorCB:
        timeoutDuration: 5s
      mcpCB:
        timeoutDuration: 5s

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
