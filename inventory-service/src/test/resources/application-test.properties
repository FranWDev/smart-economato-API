spring.datasource.url=jdbc:h2:mem:testdb_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de seguridad para tests
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=3600000
ledger.hmac-secret=test-hmac-secret-for-ledger-integrity-verification

# Desactivar la inicialización de datos por defecto
spring.sql.init.mode=never

# Configuración de Hikari para tests
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.open-in-view=false

# Habilitar la consola de H2 para debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configuración de logging para tests - Máximo silencio y velocidad
# ==========================================
spring.main.banner-mode=off
logging.level.root=ERROR
logging.level.com.economato=ERROR
logging.level.org.springframework=WARN
logging.level.org.springframework.web=ERROR
logging.level.org.hibernate=ERROR
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Kafka Test Configuration - DESHABILITADO para tests
# La configuración KafkaConfig está deshabilitada en perfil test mediante @Profile("!test")
spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Deshabilitar logs excesivos de Kafka en tests
logging.level.org.apache.kafka=ERROR

# ==========================================
# Observability - Deshabilitar en Tests
# ==========================================
# Deshabilitar exportación de métricas para evitar overhead en CI/CD
management.metrics.export.prometheus.enabled=false
logging.level.org.springframework.kafka=ERROR
logging.level.kafka=ERROR

# Redis Test Configuration - Deshabilitar Redis en tests
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Compatibilidad Jackson 2 en Spring Boot 4.0 (Jackson 3)
spring.jackson.use-jackson2-defaults=true

# AI Vault
ai.vault.master-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
ai.vault.current-key-version=1
ai.vault.key-versions.1=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# AI Nest
ai.nest.base-url=http://localhost:9999
ai.nest.service-key=test-service-key-for-integration-tests
ai.nest.allowed-origin=http://localhost:9999
ai.nest.stream-timeout-ms=5000
ai.nest.connection-timeout-ms=1000
ai.nest.read-timeout-ms=3000
ai.nest.max-retries=1
ai.nest.completion-endpoint=/api/completion

# AI Rate Limit
ai.rate-limit.messages-per-minute=100
ai.rate-limit.max-chats-per-user=10
ai.rate-limit.max-messages-per-chat=50
ai.rate-limit.max-api-keys-per-user=5
ai.rate-limit.fail-open=true

# AI Chat
ai.chat.default-provider=OPENAI
ai.chat.default-language=es
ai.chat.supported-languages=es,en,fr
ai.chat.title-max-length=200
ai.chat.max-concurrent-streams-per-user=2
ai.chat.auto-archive-on-limit=true

# AI Providers
ai.providers.configs.OPENAI.display-name=OpenAI
ai.providers.configs.OPENAI.key-prefix=sk-
ai.providers.configs.OPENAI.enabled=true
ai.providers.configs.OPENAI.model-default=gpt-4o
ai.providers.configs.OPENAI.max-context-tokens=128000
ai.providers.configs.ANTHROPIC.display-name=Anthropic
ai.providers.configs.ANTHROPIC.key-prefix=sk-ant-
ai.providers.configs.ANTHROPIC.enabled=true
ai.providers.configs.ANTHROPIC.model-default=claude-sonnet-4-20250514
ai.providers.configs.ANTHROPIC.max-context-tokens=200000
ai.providers.configs.GROK.display-name=Grok
ai.providers.configs.GROK.key-prefix=xai-
ai.providers.configs.GROK.enabled=true
ai.providers.configs.GROK.model-default=grok-3-mini
ai.providers.configs.GROK.max-context-tokens=131072

# AI SMG
ai.smg.token-budget=2000
ai.smg.working-memory-weight=0.57
ai.smg.entity-memory-weight=0.20
ai.smg.topic-memory-weight=0.10
ai.smg.intent-memory-weight=0.03
ai.smg.system-context-weight=0.10
ai.smg.decay-lambda=3.0
ai.smg.decay-full-threshold=0.7
ai.smg.decay-oneliner-threshold=0.3
ai.smg.topic-split-gap-minutes=5
ai.smg.topic-entity-change-threshold=0.7
ai.smg.entity-cache-ttl-seconds=30
ai.smg.catalog-cache-ttl-seconds=300
ai.smg.max-working-memory-messages=10
ai.smg.tool-result-max-chars=200
ai.smg.token-estimation-divisor=4

# AI Intents
ai.intents.patterns.STOCK_CHECK=stock,cuanto queda,disponible,inventario
ai.intents.patterns.ORDER_CREATE=pedir,pedido,encargar,comprar
ai.intents.patterns.RECIPE_QUERY=receta,ingredientes,preparar

# AI Analysis
ai.analysis.reorder-suggestion-horizon-days=14
ai.analysis.waste-risk-days-threshold=7
ai.analysis.menu-optimizer-max-recipes=20
ai.analysis.cost-breakdown-max-days=90
ai.analysis.stock-health-weight-stock=0.4
ai.analysis.stock-health-weight-batch=0.3
ai.analysis.stock-health-weight-alert=0.3

# Nest circuit breaker test settings
resilience4j.circuitbreaker.instances.nest.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.nest.sliding-window-size=5
resilience4j.circuitbreaker.instances.nest.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.nest.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.nest.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.nest.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.nest.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.nest.record-exceptions=java.net.ConnectException,java.net.UnknownHostException,java.util.concurrent.TimeoutException,java.net.SocketTimeoutException,java.io.IOException
