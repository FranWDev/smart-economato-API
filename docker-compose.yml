  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8090:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: inventory-cluster
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #     # Zookeeper eliminado de la config del UI también
  #   networks:
  #     - inventory-network
  #   restart: unless-stopped

volumes:
  turing-backend_postgres-data:
    external: true
  turing-backend_postgres-replica-data:
    external: true
  turing-backend_redis-data:
    external: true
  turing-backend_kafka-data:
    external: true
  turing-backend_prometheus-data:
    external: true
  turing-backend_grafana-data:
    external: true
  # SQLite outbox — persists forecast_outbox rows when predictor restarts
  turing-backend_predictor-outbox-data:
    external: true
  turing-backend_uploads-data:
    external: true
  # Los volúmenes de zookeeper han sido borrados de la lista

networks:
  inventory-network:
    driver: bridge
