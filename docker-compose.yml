services:
  # ===================================
  # PostgreSQL Database (ESCRITURA - PRIMARY)
  # ===================================
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    command: |
      postgres 
      -c wal_level=replica 
      -c max_connections=500
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby_feedback=on
      -c listen_addresses='*'
      -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - turing-backend_postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # PostgreSQL Replica (LECTURA - SECONDARY)
  # ===================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: inventory-postgres-replica
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5433:5432"
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    entrypoint: |
      /bin/sh -c "
      set -e
      echo '1. Asegurando permisos...'
      chmod 0700 /var/lib/postgresql/data
      chown -R postgres:postgres /var/lib/postgresql/data

      echo '2. Esperando al primario...'
      until pg_isready -h inventory-postgres -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
        sleep 2
      done
      
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo '3. Clonando base de datos...'
        rm -rf /var/lib/postgresql/data/*
        su-exec postgres pg_basebackup -h inventory-postgres -D /var/lib/postgresql/data -U ${POSTGRES_USER} -vP -R --wal-method=stream
      else
        echo '3. Datos detectados. Omitiendo clonado.'
      fi
      
      echo '4. Iniciando PostgreSQL Replica...'
      exec su-exec postgres postgres -D /var/lib/postgresql/data -c max_connections=500 -c hot_standby=on
      "
    volumes:
      - turing-backend_postgres-replica-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # Redis Cache
  # ===================================
  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"
    volumes:
      - turing-backend_redis-data:/data
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # Kafka Message Broker (MODO KRAFT - SIN ZOOKEEPER)
  # ===================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: inventory-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # Configuraciones de KRaft (Controller + Broker)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # ID de clúster único requerido por KRaft (Base64 UUID)
      CLUSTER_ID: "ci21132kQ1Oq1y11K0r0cw"
      
      # Optimizaciones para bajo volumen
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      
      # Reducción drástica de RAM
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_LOG_CLEANER_THREADS: 1
    volumes:
      - turing-backend_kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - inventory-network
    restart: unless-stopped


  # ===================================
  # Spring Boot Backend 
  # ===================================
  backend:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-backend
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica: 
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8081"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WRITER_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_READER_URL: jdbc:postgresql://postgres-replica:5432/${POSTGRES_DB}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update # Solo por ahora en desarrollo (liquibase en proceso)
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_GENERATE_STATISTICS: "false"
      LOGGING_LEVEL_ROOT: "ERROR"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "ERROR"
      LOGGING_LEVEL_COM_ECONOMATO: "ERROR"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_MAIN_BANNER_MODE: "off"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      LEDGER_HMAC_SECRET: ${LEDGER_HMAC_SECRET}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # Limite de RAM para el contenedor Java
      JAVA_OPTS: "-Xms192m -Xmx384m -XX:+UseZGC -XX:+ZGenerational --enable-preview -Dnet.bytebuddy.experimental=true"
    deploy:
      resources:
        limits:
          memory: 1152M
    volumes:
      - turing-backend_uploads-data:/app/uploads
    networks:
      - inventory-network
    restart: unless-stopped


  # ===================================
  # Predictor Service (Python - Prophet)
  # ===================================
  predictor-service:
    build:
      context: ./predictor-service
      dockerfile: Dockerfile
    container_name: inventory-predictor
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8084:8000"
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-backend:8081
      JWT_SECRET: ${JWT_SECRET}
      INSTANCE_HOST: inventory-predictor
      INSTANCE_PORT: 8000
      # Must match an existing ADMIN username in the DB (used as JWT sub)
      PREDICTOR_USERNAME: ${PREDICTOR_USERNAME:-Admin}
      # SQLite outbox — persisted across container restarts
      SQLITE_DB_PATH: /app/data/predictor_outbox.db
    volumes:
      - turing-backend_predictor-outbox-data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # Frontend (Angular + Nginx)
  # ===================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: inventory-frontend
    depends_on:
      backend:
        condition: service_started
    expose:
      - "80"
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # Reverse Proxy Interno (Nginx)
  # ===================================
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: inventory-reverse-proxy
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      grafana:
        condition: service_started
    ports:
      - "127.0.0.1:3000:80" # Debido al proxy del servidor de prod usando 80, se cambia a 3000 y se redirige el trafico desde el proxy padre
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-network
    restart: unless-stopped

  # ===================================
  # Prometheus (Metrics Collection)
  # ===================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: inventory-prometheus
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - turing-backend_prometheus-data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================================
  # Grafana (Visualization)
  # ===================================
  grafana:
    image: grafana/grafana:10.4.2
    container_name: inventory-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: "grafana-worldmap-panel,grafana-clock-panel"
      GF_SERVER_DOMAIN: "economato.servehttp.com"
      GF_SERVER_ROOT_URL: "https://economato.servehttp.com/monitor/"
      GF_SERVER_PROTOCOL: "http"
      GF_SESSION_COOKIE_SECURE: "true"
      GF_SERVER_ENABLE_GZIP: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - turing-backend_grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================================
  # HERRAMIENTAS OPCIONALES (COMENTADAS)
  # Descomentar solo si hay que hacer debug
