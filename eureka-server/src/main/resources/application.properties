spring.application.name=eureka-server
server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# ── Response cache fix ──────────────────────────────────────────────────────
# By default Eureka caches registry responses for 30 seconds (read-only cache).
# If a service registers AFTER the last cache refresh, gateway clients fetching
# the registry will receive a stale (empty) response for up to 30 seconds.
# Setting use-read-only-response-cache=false forces the server to always read
# from the write cache (updated on every registration/deregistration event),
# so clients always see the current registry immediately.
eureka.server.use-read-only-response-cache=false
eureka.server.response-cache-update-interval-ms=2000

logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF
